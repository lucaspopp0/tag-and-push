name: Create and push a git tag
description: >-
  Create a git tag on GitHub using the GraphQL API, without a local git push.
  Inspired by planetscale/ghcommit.

branding:
  color: orange
  icon: tag

inputs:
  tag:
    description: Tag name (for example v1.0.0). The refs/tags/ prefix is added automatically.
    required: true
  release:
    required: false
    default: 'false'
    description: If 'true', creates a release pointing to the tag

outputs:
  tag-url:
    description: URL for the tag on GitHub.
  tag-sha:
    description: Commit SHA the tag points to.
  release-url:
    description: URL for the release on GitHub. Set only when release is true.

runs:
  using: node24
  main: dist/index.js
